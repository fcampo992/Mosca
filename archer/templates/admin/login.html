{% extends "base.html" %}
{% block title %}Login Admin — KiroArchery{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-8">
    <h1 class="text-2xl font-bold mb-6 text-center">Acceso Administrador</h1>

    {% if error %}
    <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
        {{ error }}
    </div>
    {% endif %}

    <div class="bg-white rounded-xl shadow p-6">
        <form method="POST" action="" novalidate>
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium mb-1">
                    Usuario <span class="text-red-500">*</span>
                </label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                           focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent"
                    autocomplete="username"
                    required
                />
            </div>

            <div class="mb-6">
                <label for="password" class="block text-sm font-medium mb-1">
                    Contraseña <span class="text-red-500">*</span>
                </label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                           focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent"
                    autocomplete="current-password"
                    required
                />
            </div>

            <button type="submit"
                    class="w-full bg-green-700 text-white py-2.5 rounded-lg text-sm font-semibold
                           hover:bg-green-800 active:bg-green-900 transition-colors">
                Ingresar
            </button>
        </form>
    </div>
</div>
{% endblock %}
