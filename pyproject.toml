[project]
name = "kiro-archery"
version = "1.0.0"
description = "Archer tournament management app"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.0",
    "turso-serverless==0.1.0",
    "cloudinary>=1.36.0",
    "bcrypt>=4.1.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[tool.vercel]
entrypoint = "archer.app:app"
